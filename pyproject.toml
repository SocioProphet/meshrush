[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshrush"
version = "0.1.0a0"
description = "Graph-operating runtime for autonomous agents in the SocioProphet ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SocioProphet" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.optional-dependencies]
# The scientific Omni-Crystal engine (graph_build, reduction, ...) needs a linear-
# algebra backend. Kept OPTIONAL so the base package stays dependency-free and the
# Basic* sessions remain a zero-dependency fallback (meshrush ADR 0005).
# numpy is BSD-3-Clause (permissive); cataloged as internal-operations vendored IP
# at ds.internal_ops.libraries.numpy in prophet-core-catalog.
scientific = ["numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
