name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source (zero-dependency base must compile)
        run: python -m compileall src

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with scientific extra
        run: python -m pip install -e '.[scientific]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
